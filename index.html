<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#1a3d1a;overflow:hidden;}
.scene{width:100%;height:100vh;background:#1a3d1a;overflow:hidden;position:relative;}
.bg-glow{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:340px;height:180px;background:radial-gradient(ellipse,rgba(126,207,110,0.18) 0%,transparent 70%);pointer-events:none;}
.leaf{position:absolute;font-size:28px;animation:sway 4s ease-in-out infinite;}
.leaf:nth-child(1){left:2%;top:10%;animation-delay:0s;font-size:36px;}
.leaf:nth-child(2){left:8%;top:50%;animation-delay:0.5s;font-size:24px;}
.leaf:nth-child(3){left:14%;top:20%;animation-delay:1s;font-size:30px;}
.leaf:nth-child(4){right:2%;top:8%;animation-delay:0.3s;font-size:36px;animation-name:sway-r;}
.leaf:nth-child(5){right:8%;top:55%;animation-delay:0.8s;font-size:24px;animation-name:sway-r;}
.leaf:nth-child(6){right:14%;top:18%;animation-delay:1.3s;font-size:30px;animation-name:sway-r;}
.leaf:nth-child(7){left:20%;bottom:5%;animation-delay:0.6s;font-size:22px;}
.leaf:nth-child(8){right:20%;bottom:8%;animation-delay:1.1s;font-size:22px;animation-name:sway-r;}
@keyframes sway{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
@keyframes sway-r{0%,100%{transform:rotate(6deg);}50%{transform:rotate(-6deg);}}
.particles{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.p{position:absolute;width:5px;height:5px;border-radius:50%;background:#7ecf6e;opacity:0;animation:floatp 6s ease-in-out infinite;}
.p:nth-child(1){left:25%;animation-delay:0s;}
.p:nth-child(2){left:45%;animation-delay:1.5s;}
.p:nth-child(3){left:65%;animation-delay:3s;}
.p:nth-child(4){left:35%;animation-delay:2s;}
.p:nth-child(5){left:55%;animation-delay:4s;}
@keyframes floatp{0%{opacity:0;bottom:10%;}40%{opacity:0.7;}100%{opacity:0;bottom:85%;}}
.title-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:90%;}
.eyebrow{font-family:Georgia,serif;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:rgba(126,207,110,0.8);margin-bottom:8px;animation:fadein 1.2s ease both;}
.main-title{font-family:Georgia,serif;font-size:48px;font-weight:700;color:#fff;line-height:1.1;text-shadow:0 2px 24px rgba(0,0,0,0.5);animation:risein 1.2s cubic-bezier(0.22,1,0.36,1) both;}
.main-title span{color:#7ecf6e;}
.underline-bar{width:80px;height:3px;background:#7ecf6e;border-radius:2px;margin:12px auto 0;animation:growbar 1.4s cubic-bezier(0.22,1,0.36,1) both;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes risein{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}
@keyframes growbar{from{width:0;opacity:0;}to{width:80px;opacity:1;}}
</style>
</head>
<body>
<div class="scene">
<div class="bg-glow"></div>
<div class="leaf">🌿</div>
<div class="leaf">🍃</div>
<div class="leaf">🌿</div>
<div class="leaf">🌿</div>
<div class="leaf">🍃</div>
<div class="leaf">🌿</div>
<div class="leaf">🍃</div>
<div class="leaf">🍃</div>
<div class="particles"><div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div></div>
<div class="title-wrap">
<div class="eyebrow">Biome Project</div>
<div class="main-title">Journey Through the<br><span>Rainforest</span></div>
<div class="underline-bar"></div>
</div>
</div>
</body>
</html>
